<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Đăng nhập</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

</head>

<body>

<h2>Đăng nhập</h2>

<div th:if="${param.error}">

    <p style="color:red">
        Username/email hoặc password không đúng
    </p>

</div>

<div th:if="${param.logout}">

    <p style="color:green">
        Bạn đã đăng xuất
    </p>

</div>

<form th:action="@{/login}"
      method="post">

    <div>

        <label>
            Username hoặc Email
        </label>

        <input
            type="text"
            name="username"
            placeholder="Username hoặc email"
            required>

    </div>

    <div>

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

    </div>

    <button type="submit">
        Đăng nhập
    </button>

</form>

</body>

</html>
